# Lint, tests and a docs build for mcl_embed.
#
# The NIF is compiled from source by this app's own pre_hooks, so the job
# needs a Rust toolchain. It builds the deterministic hash stub (no
# CARGO_FEATURES), which needs no ONNX runtime and no model download, and is
# what the Common Test suite exercises. The docs build is here because a hex
# publish of broken docs is a release nobody can read.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish-hex.yml runs this on the tagged commit and publishes only when it
  # is green (mcl-om#34).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST MATCH .tool-versions.
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rebar3 as lint lint
      - run: rebar3 ct
      - run: rebar3 ex_doc
      # The crate's structural floor. clippy.toml sets the nesting, cognitive
      # complexity and function-length limits and Cargo.toml's [lints.clippy]
      # denies all three, so this step gates them; `-D warnings` makes any other
      # clippy finding fatal too. `--profile minimal` installs rustc and cargo
      # but not clippy, hence the component step.
      - name: Install clippy for the pinned toolchain
        run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native/mcl_embed_nif
